<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playlist Music Player</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="youtube-player" style="position: absolute; left: -9999px; top: -9999px; width: 250px; height: 250px;"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-music accent-color"></i>
                <div class="logo-text">
                    <h1>Playlist Music Player</h1>
                    <span class="developer-credit">&copy; Develop By Akash Wawdhane</span>
                </div>
            </div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                <i class="fa-solid fa-sun"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Left Panel (Input & Playlist Info) -->
            <section class="left-panel">
                <!-- Input Section -->
                <div class="input-section">
                    <form id="load-playlist-form">
                        <div class="input-group">
                            <i class="fa-brands fa-youtube"></i>
                            <input type="text" id="playlist-url" placeholder="Paste YouTube Playlist URL Here" required>
                        </div>
                        <button type="submit" class="primary-btn">Load Playlist</button>
                    </form>
                    <div id="error-message" class="error-message hidden"></div>
                </div>

                <!-- Playlist Info -->
                <div id="playlist-info" class="playlist-info hidden">
                    <div class="playlist-thumbnail-container">
                        <img id="playlist-thumbnail" src="" alt="Playlist Thumbnail">
                        <div class="play-overlay">
                            <button id="play-all-btn" class="play-circle-btn">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                    </div>
                    <div class="playlist-details">
                        <h2 id="playlist-title">Playlist Title</h2>
                        <p class="playlist-meta">
                            <span id="playlist-owner">Owner Name</span>
                            <span class="dot-separator">•</span>
                            <span id="playlist-count">0 songs</span>
                        </p>
                        <button id="sync-playlist-btn" class="sync-btn" title="Fetch latest songs from YouTube">
                            <i class="fa-solid fa-arrows-rotate"></i> Sync Playlist
                        </button>
                    </div>
                </div>
            </section>

            <!-- Right Panel (Song List) -->
            <section class="right-panel">
                <div class="list-header">
                    <h3>Tracks</h3>
                </div>
                <div id="playlist-tracks" class="playlist-tracks">
                    <!-- Tracks will be injected here -->
                    <div class="empty-state">
                        <i class="fa-solid fa-compact-disc empty-icon"></i>
                        <p>No playlist loaded. Paste a URL to start listening.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Player Bar -->
        <footer class="app-player">
            <div class="player-content">
                <!-- Left: Now Playing -->
                <div class="now-playing">
                    <img id="now-playing-thumb" src="https://via.placeholder.com/60" alt="Song Thumbnail" class="hidden">
                    <div class="now-playing-info hidden">
                        <h4 id="now-playing-title">Song Title</h4>
                        <p id="now-playing-playlist">Playlist Name</p>
                    </div>
                </div>

                <!-- Center: Controls & Progress -->
                <div class="player-center">
                    <div class="player-controls">
                        <button id="shuffle-btn" class="control-btn" title="Shuffle (S)">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                        <button id="prev-btn" class="control-btn" title="Previous (Left Arrow)">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button id="play-pause-btn" class="control-btn play-pause" title="Play/Pause (Space)">
                            <i class="fa-solid fa-circle-play"></i>
                        </button>
                        <button id="next-btn" class="control-btn" title="Next (Right Arrow)">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button id="repeat-btn" class="control-btn" title="Repeat (R)">
                            <i class="fa-solid fa-repeat"></i>
                        </button>
                    </div>
                    <div class="progress-container">
                        <span id="current-time">0:00</span>
                        <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <!-- Right: Volume -->
                <div class="volume-controls">
                    <button id="mute-btn" class="control-btn" title="Mute (M)">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" id="volume-slider" value="100" min="0" max="100">
                </div>
            </div>
        </footer>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
