<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playlist Music Player</title>
    <!-- Preconnect to YouTube Media Domains for Ultra-Fast Audio Delivery -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://googlevideo.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://googlevideo.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hidden YouTube IFrame Container -->
    <div id="youtube-player" style="position: fixed; bottom: 0; right: 0; width: 200px; height: 200px; opacity: 0.001; pointer-events: none; z-index: -999;"></div>

    <!-- Dynamic Ambient Backdrop Glow -->
    <div class="ambient-glow"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon-wrap">
                    <i class="fa-solid fa-music"></i>
                </div>
                <div class="logo-text">
                    <h1>Playlist Music Player</h1>
                    <span class="developer-credit">&copy; Develop By Akash Wawdhane</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn theme-btn" aria-label="Toggle Theme" title="Toggle Theme">
                    <i class="fa-solid fa-sun"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Left Panel (Input & Playlist Info) -->
            <section class="left-panel">
                <!-- Input Section -->
                <div class="input-section">
                    <div class="section-label">IMPORT PLAYLIST</div>
                    <form id="load-playlist-form">
                        <div class="input-group">
                            <i class="fa-brands fa-youtube input-yt-icon"></i>
                            <input type="text" id="playlist-url" placeholder="Paste YouTube Playlist URL Here..." autocomplete="off" spellcheck="false" required>
                        </div>
                        <button type="submit" class="primary-btn" id="load-submit-btn">
                            <span>Load Playlist</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                    <div id="error-message" class="error-message hidden"></div>
                </div>

                <!-- Playlist Info -->
                <div id="playlist-info" class="playlist-info hidden">
                    <div class="playlist-thumbnail-container">
                        <img id="playlist-thumbnail" src="" alt="Playlist Thumbnail">
                        <div class="play-overlay">
                            <button id="play-all-btn" class="play-circle-btn" title="Play All">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                    </div>
                    <div class="playlist-details">
                        <div class="playlist-badge">PLAYLIST</div>
                        <h2 id="playlist-title">Playlist Title</h2>
                        <p class="playlist-meta">
                            <span id="playlist-owner"><i class="fa-solid fa-circle-user"></i> Owner Name</span>
                            <span class="dot-separator">•</span>
                            <span id="playlist-count">0 songs</span>
                        </p>
                        <button id="sync-playlist-btn" class="sync-btn" title="Fetch latest songs from YouTube">
                            <i class="fa-solid fa-arrows-rotate"></i>
                            <span>Sync Playlist</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Right Panel (Song List) -->
            <section class="right-panel">
                <div class="list-header">
                    <div class="list-title-wrap">
                        <h3>Tracks</h3>
                        <span class="track-count-badge" id="track-header-count">0</span>
                    </div>
                </div>
                <div id="playlist-tracks" class="playlist-tracks">
                    <!-- Tracks will be injected here -->
                    <div class="empty-state">
                        <div class="empty-icon-wrap">
                            <i class="fa-solid fa-compact-disc fa-spin-pulse" style="--fa-animation-duration: 8s;"></i>
                        </div>
                        <h4>No Playlist Loaded</h4>
                        <p>Paste any YouTube playlist URL on the left panel to load your tracks and start listening.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Player Bar -->
        <footer class="app-player">
            <div class="player-content">
                <!-- Left: Now Playing -->
                <div class="now-playing">
                    <div class="now-playing-thumb-wrap">
                        <img id="now-playing-thumb" src="https://via.placeholder.com/60" alt="Song Thumbnail" class="hidden">
                    </div>
                    <div class="now-playing-info hidden">
                        <h4 id="now-playing-title" class="truncate-text">Song Title</h4>
                        <p id="now-playing-playlist" class="truncate-text">Playlist Name</p>
                    </div>
                </div>

                <!-- Center: Controls & Progress -->
                <div class="player-center">
                    <div class="player-controls">
                        <button id="shuffle-btn" class="control-btn" title="Shuffle (S)">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                        <button id="prev-btn" class="control-btn" title="Previous (Left Arrow)">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button id="play-pause-btn" class="control-btn play-pause" title="Play/Pause (Space)">
                            <i class="fa-solid fa-circle-play"></i>
                        </button>
                        <button id="next-btn" class="control-btn" title="Next (Right Arrow)">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button id="repeat-btn" class="control-btn" title="Repeat (R)">
                            <i class="fa-solid fa-repeat"></i>
                        </button>
                    </div>
                    <div class="progress-container">
                        <span id="current-time">0:00</span>
                        <div class="seek-bar-wrapper">
                            <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" aria-label="Seek track">
                        </div>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <!-- Right: Volume -->
                <div class="volume-controls">
                    <button id="mute-btn" class="control-btn" title="Mute (M)">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <div class="volume-slider-wrapper">
                        <input type="range" id="volume-slider" value="100" min="0" max="100" aria-label="Volume">
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
